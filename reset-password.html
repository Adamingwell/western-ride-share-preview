<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · Western Ride Share</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./auth.css"></head><body><header class="shell"><a class="brand" href="./"><span>W</span>Western Ride Share</a></header><main class="shell" style="max-width:600px"><section class="auth-card"><h1 style="font-size:2.4rem">Choose a new password</h1><form id="reset-form"><label for="password">New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button class="cta" type="submit">Update password</button></form><p id="status" role="status"></p><a href="./sign-in.html">Back to sign in</a></section></main><script type="module">import{createClient}from 'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from './supabase-config.js';const s=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),f=document.querySelector('#reset-form'),o=document.querySelector('#status');f.addEventListener('submit',async e=>{e.preventDefault();const{error}=await s.auth.updateUser({password:document.querySelector('#password').value});o.textContent=error?error.message:'Password updated. You can now sign in.';if(!error)f.hidden=true;});</script></body></html>
