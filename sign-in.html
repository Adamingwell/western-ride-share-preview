<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Western Ride Share</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./auth.css"></head><body><header class="shell"><a class="brand" href="./"><span aria-hidden="true">W</span>Western Ride Share</a><nav><a href="./">Home</a><a href="./#how">How it works</a></nav></header><main class="shell auth-layout"><section class="auth-intro"><div class="eyebrow">Your commute, connected</div><h1>Ride together.<br><em>Go further.</em></h1><p>Find a seat, offer a ride, and coordinate with other Western commuters.</p></section><section class="auth-card"><h2 id="auth-heading">Welcome back</h2><p>Sign in or create an account with your email address.</p><form id="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="cta" id="auth-submit" type="submit">Sign in</button><p id="auth-status" role="status" aria-live="polite"></p></form><div class="auth-actions"><button type="button" data-mode="signin">Sign in</button><button type="button" data-mode="signup">Create account</button><button type="button" data-mode="reset">Forgot password?</button></div><small>Check your inbox for the confirmation link after registering.</small></section></main><script type="module" src="./auth.js"></script></body></html>
