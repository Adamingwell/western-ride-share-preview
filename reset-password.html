<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · Western Ride Share</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./auth.css"></head><body><header class="shell"><a class="brand" href="./"><span>W</span>Western Ride Share</a></header><main class="shell" style="max-width:600px"><section class="auth-card"><h1 style="font-size:2.4rem">Choose a new password</h1><form id="reset-form" hidden><label for="password">New password</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><button class="cta" type="submit">Update password</button></form><p id="status" role="status" aria-live="polite">Verifying your recovery link…</p><a href="./sign-in.html">Back to sign in</a></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './supabase-config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const form=document.querySelector('#reset-form');
const status=document.querySelector('#status');
const password=document.querySelector('#password');
const submit=form.querySelector('button[type="submit"]');
let recoveryReady=false;
supabase.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session){
  recoveryReady=true;
  form.hidden=false;
  status.textContent='Recovery link verified. Choose a new password of at least 12 characters.';
 }
});
const params=new URLSearchParams(location.search);
const code=params.get('code');
if(code){
 const {error}=await supabase.auth.exchangeCodeForSession(code);
 if(error)status.textContent='This recovery link is invalid or expired. Request a new one from the sign-in page.';
 else {
  recoveryReady=true;
  form.hidden=false;
  status.textContent='Recovery link verified. Choose a new password of at least 12 characters.';
 }
}else{
 const hash=new URLSearchParams(location.hash.slice(1));
 if(hash.get('error'))status.textContent='This recovery link is invalid or expired. Request a new one from the sign-in page.';
 else if(!recoveryReady){
  // Allow Supabase time to process an implicit recovery link before showing an error.
  await new Promise(resolve=>setTimeout(resolve,700));
  if(!recoveryReady)status.textContent='Open the password recovery link from your email to reset your password.';
 }
}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(!recoveryReady){status.textContent='Please open a valid recovery link first.';return}
 if(password.value.length<12){status.textContent='Use at least 12 characters.';return}
 submit.disabled=true;
 try{
  const {error}=await supabase.auth.updateUser({password:password.value});
  if(error)throw error;
  form.hidden=true;
  password.value='';
  status.textContent='Password updated. Return to sign in with your new password.';
  await supabase.auth.signOut();
 }catch(error){status.textContent=error.message||'Unable to update password.'}
 finally{submit.disabled=false}
});
</script></body></html>
